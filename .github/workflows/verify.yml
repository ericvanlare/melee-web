name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cache_epoch:
        description: Separate compiler-cache namespace for a measured cold run
        type: string
        default: v4
      disable_compiler_cache:
        description: Measure verification without persistent caches or compiler seed artifacts
        type: boolean
        default: false
      audit_compiler_cache:
        description: Inspect an existing compiler cache and retain a redacted report
        type: boolean
        default: false
      audit_cache_key:
        description: Exact existing compiler cache key to inspect when the audit is enabled
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_DEPEND: true
  CCACHE_MAXSIZE: 512M
  EM_COMPILER_WRAPPER: ccache
  # v4 starts fresh after the publication review; source/header validation and
  # compiler flags are unchanged. Public and private CI use the same cache path.
  PERSISTENT_CI_CACHE: ${{ !inputs.disable_compiler_cache }}

jobs:
  repository-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check the complete tracked snapshot
        run: python3 scripts/check_repository_content.py
      - name: Exercise snapshot and history audit boundaries
        run: python3 -m unittest discover -s tests -p 'test_repository_*.py' -v

  compiler-cache-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_compiler_cache
    needs: repository-content
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the cache inspection tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache
          ccache --version
      - name: Exercise cache inspection controls
        run: python3 -m unittest discover -s tests -p test_compiler_cache_audit.py -v
      - name: Require an exact compiler-cache identity
        env:
          REQUESTED_CACHE_KEY: ${{ inputs.audit_cache_key }}
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'compiler-[A-Za-z0-9._-]{1,480}', os.environ['REQUESTED_CACHE_KEY']):
              raise SystemExit('Supply a complete compiler cache key from the cache inventory.')
          PY
      - id: reviewed-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/ccache
          key: ${{ inputs.audit_cache_key }}
          fail-on-cache-miss: true
      - name: Inspect every restored entry without executing compiler outputs
        env:
          MATCHED_CACHE_KEY: ${{ steps.reviewed-cache.outputs.cache-matched-key }}
          REQUESTED_CACHE_KEY: ${{ inputs.audit_cache_key }}
        run: |
          mkdir -p work/compiler-cache-review
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ['MATCHED_CACHE_KEY'] != os.environ['REQUESTED_CACHE_KEY']:
              raise SystemExit('Restored cache identity did not match the requested key.')
          Path('work/compiler-cache-review/identity.json').write_text(json.dumps({
              'cache_key': os.environ['MATCHED_CACHE_KEY'],
              'workflow_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
          }, indent=2) + '\n')
          PY
          python3 scripts/audit_compiler_cache.py --cache-dir .cache/ccache \
            --output work/compiler-cache-review/audit.json
      - name: Retain the inspection report without cache payloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiler-cache-review
          path: work/compiler-cache-review/
          retention-days: 14
          if-no-files-found: error

  # These jobs only prepare ccache entries. Every downstream target still runs
  # its normal clean configure/build, including all links and linked tests.
  compiler-seed:
    if: ${{ !inputs.disable_compiler_cache }}
    needs: repository-content
    name: compiler seed (${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - id: warm
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.PERSISTENT_CI_CACHE == 'true'
        with:
          lookup-only: true
          path: .cache/ccache
          key: compiler-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_epoch || 'v4' }}-${{ hashFiles('dependencies.lock.json') }}-shared-${{ github.sha }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_epoch || 'v4' }}-${{ hashFiles('dependencies.lock.json') }}-shared-
      - name: Prepare pinned dependencies and compiler cache
        if: steps.warm.outputs.cache-matched-key == ''
        run: |
          python3 - <<'PYTHON'
          from concurrent.futures import ThreadPoolExecutor
          import subprocess

          def install_cache():
              subprocess.run(['sudo', 'apt-get', 'update', '-qq'], check=True)
              subprocess.run(['sudo', 'apt-get', 'install', '-y', '--no-install-recommends', 'ccache'], check=True)

          with ThreadPoolExecutor(max_workers=2) as pool:
              futures = [pool.submit(install_cache), pool.submit(subprocess.run, ['python3', 'scripts/bootstrap.py'], check=True)]
              for future in futures:
                  future.result()
          PYTHON
          lscpu
          free -m
          ccache --version
          df -h .
      - name: Populate one cold compiler-cache shard
        if: steps.warm.outputs.cache-matched-key == ''
        run: |
          ccache --zero-stats
          python3 scripts/ci_seed.py --shard '${{ matrix.shard }}' --jobs 2
      - name: Pack compiler entries for this workflow
        run: |
          mkdir -p .cache/ccache work/seed
          tar -cf work/seed/ccache-${{ matrix.shard }}.tar -C .cache/ccache .
      - name: Retain seed timing and cache statistics
        if: always() && steps.warm.outputs.cache-matched-key == ''
        run: |
          mkdir -p work/seed
          if [ -f work/ci-seed/shard-${{ matrix.shard }}.json ]; then
            cp work/ci-seed/shard-${{ matrix.shard }}.json work/seed/
          fi
          ccache --print-stats > work/seed/ccache-stats-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compiler-seed-${{ matrix.shard }}
          overwrite: true
          path: work/seed/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  units:
    needs: repository-content
    name: verify (${{ matrix.group }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [unit-0, unit-1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare pinned dependencies and compiler cache
        run: |
          python3 - <<'PYTHON'
          from concurrent.futures import ThreadPoolExecutor
          import subprocess

          def install_cache():
              subprocess.run(['sudo', 'apt-get', 'update', '-qq'], check=True)
              subprocess.run(['sudo', 'apt-get', 'install', '-y', '--no-install-recommends', 'ccache'], check=True)

          with ThreadPoolExecutor(max_workers=2) as pool:
              futures = [pool.submit(install_cache), pool.submit(subprocess.run, ['python3', 'scripts/bootstrap.py'], check=True)]
              for future in futures:
                  future.result()
          PYTHON
          lscpu
          free -m
          ccache --version
          df -h .
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.PERSISTENT_CI_CACHE == 'true'
        with:
          path: .cache/ccache
          key: compiler-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_epoch || 'v4' }}-${{ hashFiles('dependencies.lock.json') }}-shared-${{ github.sha }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_epoch || 'v4' }}-${{ hashFiles('dependencies.lock.json') }}-shared-
      - name: Verify isolated partition
        run: |
          ccache --zero-stats
          python3 scripts/ci_verify.py --group '${{ matrix.group }}' --jobs 2
      - name: Compiler cache statistics
        if: always()
        run: |
          ccache --show-stats --verbose
          mkdir -p work/ci
          ccache --print-stats > work/ci/ccache-${{ matrix.group }}.txt
      - name: Retain bounded timing and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ matrix.group }}
          overwrite: true
          path: work/ci/
          retention-days: 14
          if-no-files-found: error

  partitions:
    name: verify (${{ matrix.group }})
    if: >-
      always() && needs.repository-content.result == 'success' &&
      (needs.compiler-seed.result == 'success' ||
       (needs.compiler-seed.result == 'skipped' &&
        inputs.disable_compiler_cache))
    needs: [repository-content, compiler-seed]
    runs-on: ubuntu-24.04-arm
    # The optional cache-disabled comparison keeps every target and permits
    # the longer cold build. Normal private/public verification uses caching.
    timeout-minutes: ${{ !inputs.disable_compiler_cache && 10 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        group: [runtime, graphics, gameplay, fighter, effects, menus]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare pinned dependencies and compiler cache
        run: |
          python3 - <<'PYTHON'
          from concurrent.futures import ThreadPoolExecutor
          import subprocess

          def install_cache():
              subprocess.run(['sudo', 'apt-get', 'update', '-qq'], check=True)
              subprocess.run(['sudo', 'apt-get', 'install', '-y', '--no-install-recommends', 'ccache'], check=True)

          with ThreadPoolExecutor(max_workers=2) as pool:
              futures = [pool.submit(install_cache), pool.submit(subprocess.run, ['python3', 'scripts/bootstrap.py'], check=True)]
              for future in futures:
                  future.result()
          PYTHON
          lscpu
          free -m
          ccache --version
          df -h .
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.PERSISTENT_CI_CACHE == 'true'
        with:
          path: .cache/ccache
          key: compiler-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_epoch || 'v4' }}-${{ hashFiles('dependencies.lock.json') }}-shared-${{ github.sha }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_epoch || 'v4' }}-${{ hashFiles('dependencies.lock.json') }}-shared-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.PERSISTENT_CI_CACHE == 'true'
        with:
          pattern: compiler-seed-*
          path: work/compiler-seeds
      - name: Merge current-workflow compiler entries
        if: env.PERSISTENT_CI_CACHE == 'true'
        run: |
          mkdir -p .cache/ccache
          for shard in 0 1 2 3 4 5; do
            tar -xf "work/compiler-seeds/compiler-seed-$shard/ccache-$shard.tar" -C .cache/ccache
          done
      - name: Verify isolated partition
        run: |
          ccache --zero-stats
          python3 scripts/ci_verify.py --group '${{ matrix.group }}' --jobs 2
      - name: Compiler cache statistics
        if: always()
        run: |
          ccache --show-stats --verbose
          mkdir -p work/ci
          ccache --print-stats > work/ci/ccache-${{ matrix.group }}.txt
      - name: Retain bounded timing and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ matrix.group }}
          overwrite: true
          path: work/ci/
          retention-days: 14
          if-no-files-found: error
      - name: Save shared compiler entries
        if: env.PERSISTENT_CI_CACHE == 'true' && matrix.group == 'runtime'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/ccache
          key: compiler-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_epoch || 'v4' }}-${{ hashFiles('dependencies.lock.json') }}-shared-${{ github.sha }}

  public-shell:
    needs: repository-content
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Exercise release rejection controls
        run: python3 -m unittest discover -s tests -p 'test_public_*.py' -v
      - name: Build and audit the isolated shell
        run: |
          mkdir -p build
          python3 scripts/build_public.py --output build/public-shell --mode preview
          python3 scripts/audit_public.py --output build/public-shell --manifest build/public-shell.manifest.json

  # Retain the existing check name as the mandatory aggregate. A missing,
  # canceled, failed or skipped partition can never become a green result.
  browser-build:
    if: always()
    needs: [repository-content, units, partitions, public-shell]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report workflow and queue durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_report.py --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --snapshot --summary "$GITHUB_STEP_SUMMARY"
      - name: Require every verification partition
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if failed:
              raise SystemExit(f'Verification did not pass: {failed}')
          print('All verification jobs succeeded; checking their reported inventories.')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-*
          path: work/ci-collected
          merge-multiple: true
      - name: Require current-revision reports and complete discovery
        run: python3 scripts/ci_aggregate.py --reports work/ci-collected --commit "$GITHUB_SHA"

# GPU/original-game acceptance remains separate. These jobs preserve the
# checked build configuration and all existing all/fighter target closures.
