name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test setup, server and asset parsers
        run: python3 -m unittest discover -s tests -v
      - name: Install pinned dependencies
        run: python3 scripts/bootstrap.py
      - name: Validate original HSD polygon and transform paths
        run: python3 -m unittest discover -s tests -p 'test_hsd_*_bridge.py' -v
      - name: Compile browser and gameplay targets
        run: python3 scripts/build.py --jobs 2
      - name: Run original gameplay runtime and ABI checks
        run: |
          python3 -m unittest discover -s tests -p 'test_gameplay_*.py' -v
          python3 -m unittest discover -s tests -p 'test_common_tables.py' -v
          python3 -m unittest discover -s tests -p 'test_hsd_native*.py' -v
          python3 scripts/check_gameplay.py
          python3 scripts/gameplay_census.py --jobs 2
      - name: Validate browser input adapter with configured SDL headers
        run: python3 -m unittest discover -s tests -p test_browser_input.py -v

# GPU rendering and original-game behavioral comparisons need the documented
# acceptance checks. The gameplay traces validate only their named boundaries;
# a green build does not mean a fighter was initialized or a match was played.
