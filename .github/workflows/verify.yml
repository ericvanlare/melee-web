name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test setup, server and asset parsers
        run: python3 -m unittest discover -s tests -v
      - name: Install pinned dependencies
        run: python3 scripts/bootstrap.py
      - name: Validate original HSD polygon and transform paths
        run: python3 -m unittest discover -s tests -p 'test_hsd_*_bridge.py' -v
      - name: Compile browser probe
        run: python3 scripts/build.py --jobs 2
      - name: Validate browser input adapter with configured SDL headers
        run: python3 -m unittest discover -s tests -p test_browser_input.py -v

# This checks compilation only. Real WebGPU rendering still needs the documented
# browser smoke test; do not describe a green build as gameplay validation.
