name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cache_epoch:
        description: Separate compiler-cache namespace for a measured cold run
        type: string
        default: v2

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  partitions:
    name: verify (${{ matrix.group }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [unit, runtime, graphics, gameplay, fighter, effects, menus]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DEPEND: true
      CCACHE_MAXSIZE: 512M
      EM_COMPILER_WRAPPER: ccache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install compiler cache and record runner resources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache
          ccache --version
          lscpu
          free -m
          df -h .
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/ccache
          key: compiler-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_epoch || 'v2' }}-${{ hashFiles('dependencies.lock.json') }}-${{ matrix.group }}-${{ github.sha }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_epoch || 'v2' }}-${{ hashFiles('dependencies.lock.json') }}-${{ matrix.group }}-
      - name: Bootstrap pinned dependencies
        run: python3 scripts/bootstrap.py
      - name: Verify isolated partition
        run: |
          ccache --zero-stats
          python3 scripts/ci_verify.py --group '${{ matrix.group }}' --jobs 3
      - name: Compiler cache statistics
        if: always()
        run: |
          ccache --show-stats --verbose
          mkdir -p work/ci
          ccache --print-stats > work/ci/ccache-${{ matrix.group }}.txt
      - name: Retain bounded timing and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ matrix.group }}-${{ github.run_attempt }}
          path: work/ci/
          retention-days: 14
          if-no-files-found: error

  public-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Exercise release rejection controls
        run: python3 -m unittest discover -s tests -p 'test_public_*.py' -v
      - name: Build and audit the isolated shell
        run: |
          mkdir -p build
          python3 scripts/build_public.py --output build/public-shell --mode preview
          python3 scripts/audit_public.py --output build/public-shell --manifest build/public-shell.manifest.json

  # Retain the existing check name as the mandatory aggregate. A missing,
  # canceled, failed or skipped partition can never become a green result.
  browser-build:
    if: always()
    needs: [partitions, public-shell]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report workflow and queue durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_report.py --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --snapshot --summary "$GITHUB_STEP_SUMMARY"
      - name: Require every verification partition
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if failed:
              raise SystemExit(f'Verification did not pass: {failed}')
          print('All compilation, test, source-census and public-shell partitions passed.')
          PY

# GPU/original-game acceptance remains separate. These jobs preserve the
# checked build configuration and all existing all/fighter target closures.
