name: Public shell release boundary
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  public-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Exercise release rejection controls
        run: python3 -m unittest discover -s tests -p 'test_public_*.py' -v
      - name: Build and audit the isolated shell
        run: |
          mkdir -p build
          python3 scripts/build_public.py --output build/public-shell --mode preview
          python3 scripts/audit_public.py --output build/public-shell --manifest build/public-shell.manifest.json

  public-player:
    # The native Emscripten build is intentionally a manual/release checkpoint;
    # Verify exercises the same fail-closed fixture and HTTP tests on each PR.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Bootstrap pinned native and browser dependencies
        run: python3 scripts/bootstrap.py
      - name: Build the Release public runtime identity
        run: python3 scripts/build.py --target runtime-public --configuration Release --jobs 2
      - name: Package and audit the player graph
        run: |
          python3 scripts/build_public.py --profile player --mode preview \
            --runtime-dir build/browser-public-release --output build/public-player \
            --manifest build/public-player.manifest.json
          python3 scripts/audit_public.py --profile player --output build/public-player \
            --manifest build/public-player.manifest.json
