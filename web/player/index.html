<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>WebMelee (WIP)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{STYLE_URL}}">
  <script type="module" src="{{SCRIPT_URL}}"></script>
</head>
<body>
  <main id="player" aria-label="WebMelee player">
    <div id="runtime-host" aria-label="Game">
      <canvas id="canvas" width="640" height="480" tabindex="0" aria-label="Game screen"></canvas>
      <p id="idle-hint" role="status">Select your local disc, then choose Play to start.</p>
    </div>
    <div id="toolbar" role="toolbar" aria-label="Game controls">
      <button id="choose-disc" type="button" disabled>Disc</button>
      <input id="disc-file" type="file" accept=".iso,.gcm,.ciso" aria-label="USA 1.02 disc image" hidden>
      <button id="start-game" type="button" disabled>Play</button>
      <button id="pause-game" type="button" disabled>Pause</button>
      <button id="controls-open" type="button">Controls</button>
      <button id="fullscreen" type="button">Fullscreen</button>
      <button id="end-session" type="button" disabled>Eject</button>
      <button id="status" type="button" disabled aria-live="polite">Loading…</button>
      <progress id="progress" aria-label="Preparing local data" hidden></progress>
      <span id="edition">alpha · no audio</span> <a href="/notices">About / legal</a>
    </div>
  </main>
  <dialog id="disc-dialog" aria-label="Select your game copy">
    <p>Audio is disabled in this alpha. Some CPU actions can stop the player (opcode 63); restart may be required.</p>
    <p>Select an unmodified USA 1.02 ISO, GCM or CISO. The selected file and game data stay on this device.</p>
    <label><input id="disc-ack" type="checkbox"> I am selecting a copy of the game that I am legally authorized to use.</label>
    <div class="dialog-actions"><button id="disc-cancel" type="button">Cancel</button><button id="disc-continue" type="button" disabled>Choose file</button></div>
  </dialog>
  <dialog id="controls-dialog" aria-label="Controls"></dialog>
  <dialog id="error-dialog" aria-label="Player error">
    <p id="error" role="alert"></p>
    <div class="dialog-actions"><button id="retry" type="button">Restart</button><button id="error-close" type="button">Close</button></div>
  </dialog>
  <noscript><button type="button" disabled>JavaScript required</button></noscript>
</body>
</html>
