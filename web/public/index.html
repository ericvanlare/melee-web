<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>WebMelee (WIP)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{STYLE_URL}}">
  <script src="{{SCRIPT_URL}}" defer></script>
</head>
<body class="game-page">
  <main id="player" aria-label="WebMelee work in progress">
    <div id="runtime-host" aria-label="Game area"></div>
    <div id="toolbar" role="toolbar" aria-label="Game controls">
      <button id="choose-disc" type="button" disabled>Disc</button>
      <button id="start-game" type="button" disabled>Play</button>
      <button id="pause-game" type="button" disabled>Pause</button>
      <button id="controls-open" type="button" disabled>Controls</button>
      <button id="fullscreen" type="button" hidden>Fullscreen</button>
      <button id="end-session" type="button" disabled>Eject</button>
      <span id="status">WIP. Gameplay is not available yet.</span>
      <a href="/notices">About / legal</a>
    </div>
    <p id="fullscreen-status" role="status"></p>
  </main>
</body>
</html>
